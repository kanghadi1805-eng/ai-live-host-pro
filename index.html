
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI LIVE HOST PRO V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101329;color:white;font-family:Arial;padding:16px}
h1{color:#ff55b5}
.card{background:#20294b;padding:18px;border-radius:16px;margin:14px 0}
input,textarea{width:100%;padding:14px;margin:7px 0;background:#101329;color:white;border:1px solid #63709a;border-radius:10px}
button{padding:13px;border:0;border-radius:10px;background:#ff43a5;color:white;font-weight:bold;margin:5px 0;width:100%}
button.secondary{background:#5141bc}
#avatar{width:100%;height:330px;object-fit:cover;border-radius:14px;background:#333}
#status{color:#53e6ad}
</style>
</head>
<body>
<h1>AI LIVE HOST PRO</h1>
<p>Virtual Female Host | TikTok Shopping</p>

<div class="card">
<img id="avatar" alt="Avatar host" src=""
style="display:none">
<div id="placeholder" style="text-align:center;padding:80px 5px">
<h2>👩🏻‍💻</h2>
Pilih foto host perempuan
</div>
<input type="file" accept="image/*" onchange="uploadAvatar(event)">
<p id="status">Host siap digunakan</p>
</div>

<div class="card">
<h3>DATA PRODUK</h3>
<input id="produk" placeholder="Nama produk">
<input id="harga" placeholder="Harga produk">
<textarea id="detail" placeholder="Keunggulan produk"></textarea>
<button onclick="buatNaskah()">Buat Promosi</button>
</div>

<div class="card">
<h3>NASKAH HOST AI</h3>
<textarea id="naskah" rows="6">Halo semuanya! Selamat datang di live kami.</textarea>
<button onclick="bicara()">▶ MULAI BICARA</button>
<button class="secondary" onclick="berhenti()">■ BERHENTI</button>
</div>

<div class="card">
<h3>SIMULASI KOMENTAR</h3>
<input id="komentar" placeholder="Pertanyaan penonton">
<button onclick="jawab()">Jawab Komentar</button>
<p id="jawaban">Jawaban host akan muncul di sini.</p>
</div>

<script>
function uploadAvatar(e){
 const f=e.target.files[0];
 if(!f)return;
 const url=URL.createObjectURL(f);
 document.getElementById('avatar').src=url;
 document.getElementById('avatar').style.display='block';
 document.getElementById('placeholder').style.display='none';
}
function buatNaskah(){
 const p=produk.value||'produk pilihan';
 const h=harga.value||'hubungi penjual';
 const d=detail.value||'kualitas bagus dan nyaman';
 naskah.value=`Halo semuanya! Selamat datang di live kami.
Hari ini kita punya ${p}.
Harganya hanya ${h}.
Keunggulannya ${d}.
Yuk, cek produk dan detail pembelian di keranjang kuning. Terima kasih!`;
}
function bicara(){
 if(!('speechSynthesis' in window)){
 alert('Browser belum mendukung suara');return;
 }
 berhenti();
 const u=new SpeechSynthesisUtterance(naskah.value);
 u.lang='id-ID';
 u.rate=0.92;
 u.pitch=1.08;
 u.onstart=()=>status.textContent='Host sedang berbicara...';
 u.onend=()=>status.textContent='Host siap digunakan';
 speechSynthesis.speak(u);
}
function berhenti(){
 speechSynthesis.cancel();
 status.textContent='Host dihentikan';
}
function jawab(){
 const q=komentar.value.toLowerCase();
 const p=produk.value||'produk ini';
 let a;
 if(q.includes('harga'))a='Harga '+p+' bisa dilihat pada informasi produk ya.';
 else if(q.includes('warna'))a='Silakan cek pilihan warna yang tersedia di produk ya.';
 else if(q.includes('ukuran'))a='Silakan cek variasi ukuran pada halaman produk.';
 else if(q.includes('kirim'))a='Informasi pengiriman tersedia pada halaman produk.';
 else a='Terima kasih pertanyaannya! Silakan cek detail '+p+' di keranjang kuning.';
 jawaban.textContent=a;
 naskah.value=a;
}
</script>
</body>
</html>
